name: reccmp-report

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "reccmp-report/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  RECCMP_TARGET: HOVER

jobs:
  report:
    name: Generate and publish reccmp report
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch MSVC 5.0 (Visual C++ 97 SP3)
        uses: actions/checkout@v6
        with:
          repository: archaic-msvc/msvc500sp3
          path: msvc500

      - name: Setup MSVC 5.0
        shell: cmd
        run: |
          echo INCLUDE=${{ github.workspace }}\msvc500\include;${{ github.workspace }}\msvc500\atl\include;${{ github.workspace }}\msvc500\mfc\include>>%GITHUB_ENV%
          echo LIB=${{ github.workspace }}\msvc500\lib;${{ github.workspace }}\msvc500\mfc\lib>>%GITHUB_ENV%
          echo ${{ github.workspace }}\msvc500\bin>>%GITHUB_PATH%
          echo ${{ github.workspace }}\msvc500\redist>>%GITHUB_PATH%

      - name: Setup Ninja
        shell: pwsh
        run: |
          curl.exe -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip -o "$env:GITHUB_WORKSPACE\ninja-win.zip"
          Expand-Archive "$env:GITHUB_WORKSPACE\ninja-win.zip" -DestinationPath "$env:GITHUB_WORKSPACE" -Force
          Add-Content -Path $env:GITHUB_PATH -Value $env:GITHUB_WORKSPACE
          & "$env:GITHUB_WORKSPACE\ninja.exe" --version

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: 3.x

      - name: Install reccmp
        shell: sh
        run: |
          python -m pip -q install reccmp

      - name: Download original binary
        shell: sh
        run: |
          mkdir -p originals
          curl -fLSs -o originals/HOVER.EXE \
            "https://archive.org/download/hoverwindows95/hover.zip/HOVER%21%2FHOVER.EXE"
          echo "e49b284bed8773bc2a14f4977d1be4ce5eedd1df79896e7b556e7eb538e2f09a  originals/HOVER.EXE" | sha256sum -c -

      - name: Fetch latest report
        shell: sh
        run: |
          curl -fsSL -o prev-report.json https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/reccmp-report/report.json || echo "No previous report found"

      - name: Detect originals
        shell: sh
        run: |
          reccmp-project detect --what original --search-path originals

      - name: CMake (configure)
        shell: sh
        run: |
          cmake -S . -B build -GNinja -DMSVC_50_FOR_RECCMP=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: CMake (build)
        shell: sh
        run: |
          # MSVC 5.0 cannot share one VC50.PDB between concurrent cl.exe
          # processes (fatal error C1033), so the build must be serial.
          cmake --build build -- -j1

      - name: Run reccmp
        working-directory: build
        shell: bash
        run: |
          diff_args=()
          if [ -s ../prev-report.json ]; then
            diff_args+=(--diff ../prev-report.json)
          fi
          set +e
          reccmp-reccmp --no-color --target "$RECCMP_TARGET" \
            "${diff_args[@]}" \
            --json new-reccmp-report.json \
            --json-diet \
            -S new-reccmp-progress.svg \
            >reccmp-output.txt 2>&1
          status=$?
          set -e
          cat reccmp-output.txt
          ls -la
          if [ "$status" -ne 0 ]; then
            echo "::error::reccmp-reccmp failed with exit code $status"
            exit "$status"
          fi
          mv new-reccmp-progress.svg new-reccmp-report.json "$GITHUB_WORKSPACE"/

      - name: Publish reccmp report
        shell: bash
        run: |
          mkdir -p reccmp-report
          cp new-reccmp-progress.svg reccmp-report/progress.svg
          cp new-reccmp-report.json reccmp-report/report.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reccmp-report/progress.svg reccmp-report/report.json
          git commit -m "Update reccmp report from ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push